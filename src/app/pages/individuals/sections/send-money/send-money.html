<section class="ind-send">
  <div class="inds-slider">
    <div class="inds-intro">
      <h2 class="inds-title">Funciones <br>clave de <br>PAGOCEL</h2>
      <div class="inds-intro-image">
        <img src="/loreimpsun.jpg" alt="Funcionalidades PAGOCEL">
      </div>
      <p class="inds-subtitle">Lorem ipsum dolor sit amet elit, consectetur adipiscing elit cursus imperdiet elementum
        Quam aliquam. Quam vel aliquam sit vulputate.</p>
    </div>

    @for (card of cards; track card.num) {
    <article class="inds-card">
      <h3 class="inds-card-header">{{ card.title }}</h3>
      <div class="inds-card-img">
        <img [src]="card.img" [alt]="card.title">
      </div>
      <div class="inds-card-body">
        <span class="inds-num">{{ card.num }}</span>
        <div class="inds-card-text">
          <p>{{ card.description }}</p>
        </div>
      </div>
    </article>
    }
  </div>
</section>
