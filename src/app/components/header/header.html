<header class="header" [class.scrolled]="isScrolled()">
  <app-logo />

  <nav class="header-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="header-link">Inicio</a>
    <a routerLink="/personas" routerLinkActive="active" class="header-link">Personas</a>
    <a routerLink="/empresas" routerLinkActive="active" class="header-link">Empresas</a>
    <a routerLink="/instituciones-financieras" routerLinkActive="active" class="header-link">Instituciones</a>
    <a routerLink="/que-es-pagocel" routerLinkActive="active" class="header-link header-link--overflow">Qué es PAGOCEL</a>
    <a routerLink="/seguridad" routerLinkActive="active" class="header-link header-link--overflow">Seguridad</a>
    <a routerLink="/desarrolladores" routerLinkActive="active" class="header-link header-link--overflow">Desarrolladores</a>

    <div class="nav-more">
      <button type="button" class="nav-more-trigger" (click)="toggleMore($event)" [class.active]="moreOpen()"
        aria-haspopup="true" [attr.aria-expanded]="moreOpen()">
        Más
        <svg class="nav-more-chevron" [class.open]="moreOpen()" viewBox="0 0 20 20" fill="none">
          <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="nav-more-dropdown" [class.open]="moreOpen()">
        <a routerLink="/que-es-pagocel" routerLinkActive="active" (click)="closeMore()">Qué es PAGOCEL</a>
        <a routerLink="/seguridad" routerLinkActive="active" (click)="closeMore()">Seguridad</a>
        <a routerLink="/desarrolladores" routerLinkActive="active" (click)="closeMore()">Desarrolladores</a>
      </div>
    </div>
  </nav>

  <a routerLink="/descargar" class="header-cta">Descargar App</a>

  <button class="header-burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="menu-overlay" [class.open]="menuOpen()" (click)="closeMenu()"></div>
<nav class="menu-modal" [class.open]="menuOpen()" role="dialog" aria-label="Menú de navegación">
  <div class="menu-modal-header">
    <app-logo />
    <button class="menu-close-btn" (click)="closeMenu()" aria-label="Cerrar menú">&times;</button>
  </div>
  <div class="menu-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Inicio</a>
    <a routerLink="/personas" routerLinkActive="active" (click)="closeMenu()">Personas</a>
    <a routerLink="/empresas" routerLinkActive="active" (click)="closeMenu()">Empresas</a>
    <a routerLink="/instituciones-financieras" routerLinkActive="active" (click)="closeMenu()">Instituciones Financieras</a>
    <a routerLink="/comercios" routerLinkActive="active" (click)="closeMenu()">Comercios</a>
    <a routerLink="/como-funciona" routerLinkActive="active" (click)="closeMenu()">Cómo Funciona</a>
    <a routerLink="/que-es-pagocel" routerLinkActive="active" (click)="closeMenu()">Qué es PAGOCEL</a>
    <a routerLink="/seguridad" routerLinkActive="active" (click)="closeMenu()">Seguridad</a>
    <a routerLink="/desarrolladores" routerLinkActive="active" (click)="closeMenu()">Desarrolladores</a>
    <a routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">Nosotros</a>
    <a routerLink="/ayuda" routerLinkActive="active" (click)="closeMenu()">Ayuda</a>
  </div>
  <div class="menu-modal-footer">
    <a routerLink="/descargar" class="menu-cta" (click)="closeMenu()">Descargar App</a>
  </div>
</nav>
